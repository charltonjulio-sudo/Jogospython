a{color:#2a5d8f}

const CH = 'area_professor_senha';
const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
async function abrir(senha) {
  const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(senha), 'PBKDF2', false, ['deriveKey']);
  const k = await crypto.subtle.deriveKey({ name: 'PBKDF2', salt: b64(P.s), iterations: P.n, hash: 'SHA-256' }, base, { name: 'AES-GCM', length: 256 }, false, ['decrypt']);

}
function mostrar(html) { document.open(); document.write(html); document.close(); }
const err = document.getElementById('err'), bt = document.getElementById('bt');

document.getElementById('f').onsubmit = async e => {

  bt.disabled = true; bt.textContent = 'Abrindo…'; err.textContent = '';

};
(async () => { let pw = null; try { pw = sessionStorage.getItem(CH); } catch (x) {} if (pw && window.crypto && crypto.subtle) { try { mostrar(await abrir(pw)); } catch (x) { try { sessionStorage.removeItem(CH); } catch (y) {} } } })();
