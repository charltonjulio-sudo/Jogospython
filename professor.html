<style>
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;background:#14213d;color:#1d2433;font:16px/1.5 "Segoe UI",Roboto,"Noto Sans",Ubuntu,Arial,sans-serif;padding:16px}
.card{background:#fff;border-radius:18px;padding:24px;max-width:380px;width:100%;box-shadow:0 10px 0 #0b1426}
h1{font-size:24px;margin:0 0 4px}
p{color:#5d6678;margin:0 0 16px}
label{display:block;font-weight:700;font-size:14px;margin-bottom:4px}
input[type=password]{width:100%;font:inherit;font-size:18px;border:2px solid #d5d1c6;border-radius:10px;padding:10px 12px}
input[type=password]:focus{outline:none;border-color:#2a5d8f}
.lembrar{display:flex;gap:8px;align-items:center;font-size:14px;color:#5d6678;margin:10px 0 0;font-weight:400}
button{width:100%;margin-top:14px;font:inherit;font-weight:800;border:0;border-radius:12px;padding:12px;background:#ffd43b;color:#14213d;cursor:pointer;box-shadow:0 4px 0 #b38f10}
button:disabled{opacity:.6;cursor:wait}
.err{color:#c0392b;font-weight:700;min-height:24px;margin-top:10px;font-size:15px}
a{color:#2a5d8f}
</style></head><body>
<form class="card" id="f" autocomplete="off">

</form>

const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
async function abrir(senha) {
