*{box-sizing:border-box}

.err{color:#c0392b;font-weight:700;min-height:24px;margin-top:10px;font-size:15px}
a{color:#2a5d8f}

const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
